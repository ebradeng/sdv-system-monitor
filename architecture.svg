  <text x="310" y="933" class="small">Each vehicle has a distinct identity and a separately exposed Kuksa port.</text>
  <text x="310" y="956" class="small">Bridge ingress targets the matching Kuksa instance; exact port mappings are open.</text>
  <text x="310" y="979" class="small">Dashed purple: planned CARLA path. The four-vehicle deployment is also future work.</text>
  <text x="310" y="1002" class="small">Current test: HTTP bridge posts to a local receiver instead of Cloud Run.</text>

