  <text x="155" y="572" text-anchor="middle" class="small">Route by vehicle identity</text>
  <text x="155" y="593" text-anchor="middle" class="small">to exposed Kuksa ports</text>
  <text x="155" y="614" text-anchor="middle" class="small">Planned</text>
