<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110" role="img" aria-labelledby="title desc">
  <title id="title">SDV system monitor intended architecture</title>
  <desc id="desc">Four Docker quickstart containers on Windows each contain QEMU, Leda, Kuksa and Zenoh. Windows mock sensors and future CARLA data feed Kuksa. Each vehicle's Python bridge posts telemetry to Cloud Run, followed by Pub/Sub and Splunk on a separate machine. The first milestone uses a local HTTP receiver for one vehicle's tire pressure.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-planned" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #172033; }
      .title { font-size: 25px; font-weight: bold; }
      .sub { font-size: 15px; fill: #475569; }
      .heading { font-size: 18px; font-weight: bold; }
      .label { font-size: 15px; font-weight: bold; }
      .small { font-size: 13px; }
      .tiny { font-size: 12px; }
      .outer { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .docker { fill: #e8f4ff; stroke: #2563a6; stroke-width: 2; }
      .qemu { fill: #fff; stroke: #7893ae; stroke-width: 1.5; }
      .leda { fill: #effcf5; stroke: #25835b; stroke-width: 1.5; }
      .stage { fill: #fff; stroke: #475569; stroke-width: 1.4; }
      .cloud { fill: #eef4ff; stroke: #4f70ac; stroke-width: 2; }
      .future { fill: #faf5ff; stroke: #7c3aed; stroke-width: 2; stroke-dasharray: 7 5; }
      .flow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .planned-flow { fill: none; stroke: #7c3aed; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow-planned); }
    </style>
  </defs>

  <text x="30" y="38" class="title">SDV system monitor — intended architecture</text>
  <text x="30" y="63" class="sub">First milestone: one quickstart vehicle sends tire pressure to a local HTTP receiver. Cloud Run, four vehicles and CARLA are the target.</text>

  <rect x="25" y="85" width="1080" height="950" rx="14" class="outer"/>
  <text x="45" y="112" class="heading">Windows 11 simulation host</text>
  <text x="45" y="134" class="small">Docker Compose starts one x86_64 Leda quickstart container per vehicle.</text>

